name: earth-space-analog-finder

services:
  lock:
    profiles: ["tools"]
    image: python:3.12-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
    working_dir: /work
    environment:
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ./backend:/work
      - pip_cache:/root/.cache/pip
    command:
      - sh
      - -c
      - >-
        python -m venv /tmp/lockenv
        && /tmp/lockenv/bin/python -m pip install pip-tools==7.5.3
        && /tmp/lockenv/bin/pip-compile --quiet --allow-unsafe --generate-hashes --strip-extras --output-file requirements.txt requirements.in
        && /tmp/lockenv/bin/pip-compile --quiet --allow-unsafe --generate-hashes --strip-extras --output-file requirements-dev.txt requirements-dev.in

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analog_finder}
      POSTGRES_USER: ${POSTGRES_USER:-analog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Exécutez scripts/setup.ps1 pour créer .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 30s

  frontend:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1/
      VITE_BACKEND_ORIGIN: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgis_data:
  pip_cache:
